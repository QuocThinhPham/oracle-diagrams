<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sơ đồ kiến trúc Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f4;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --ink:#151922;
  --ink-2:#4b5263;
  --ink-3:#7d8495;
  --line:#e3e6eb;
  --line-2:#cdd2da;
  --accent:#c74634;
  --accent-soft:#fbebe8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

.app{display:grid;grid-template-columns:268px 1fr;height:100vh}
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:4px 0 0;font-size:16px;line-height:1.3;font-weight:700}

nav{padding:12px 10px 20px}
.group{margin-top:12px}
.group-title{display:flex;align-items:center;gap:8px;padding:0 10px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.group-title i{width:8px;height:8px;border-radius:2px;background:var(--c)}
nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:1px 0;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a small{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500}
nav a[aria-current="page"] small{color:inherit;opacity:.75}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.main{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.bar .sp{flex:1}
.btn{appearance:none;font:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#pick{display:none;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);max-width:100%}
iframe{flex:1;width:100%;border:0;background:var(--bg)}

.work{flex:1;display:flex;min-height:0}
.work iframe{flex:1;min-width:0}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn .count{margin-left:6px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}

/* khung bình luận */
.comments{display:none;flex-direction:column;width:380px;border-left:1px solid var(--line);background:var(--surface);overflow:auto}
.app.show-comments .comments{display:flex}
.c-head{position:sticky;top:0;z-index:1;display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.c-head h2{margin:0;font-size:14px;font-weight:700}
.c-head p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.c-head .x{margin-left:auto;appearance:none;border:0;background:none;font-size:18px;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:6px}
.c-head .x:hover{background:var(--surface-2);color:var(--ink)}
.c-body{padding:8px 12px 20px}
.c-note{margin:10px 4px 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.c-note code{font-size:12px}
.cform{display:flex;flex-direction:column;gap:8px;margin:10px 4px 4px;padding:12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2)}
.cform input,.cform textarea{font:inherit;font-size:13px;padding:7px 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);resize:vertical}
.cform input:focus,.cform textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.cform .row{display:flex;align-items:center;gap:8px}
.cform .msg{flex:1;font-size:12px;color:var(--ink-3)}
.cform .msg.err{color:var(--accent)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.6;cursor:progress}
.cmt{margin:10px 4px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.cmt-meta{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-3)}
.cmt-meta b{font-size:13px;color:var(--ink)}
.cmt-meta span{margin-left:auto}
.cmt p{margin:6px 0 0;font-size:13px;color:var(--ink-2);white-space:pre-wrap}
nav a .badge{margin-left:auto;min-width:18px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;text-align:center}
nav a small + .badge{margin-left:6px}
.feed a{align-items:flex-start;flex-direction:column;gap:2px}
.feed a .f-meta{font-size:11px;color:var(--ink-3)}
.feed a .f-text{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@media (max-width:860px){
  .comments{position:fixed;inset:auto 0 0 0;width:auto;height:70vh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(20,25,35,.15);z-index:5}

  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:none}
  #pick{display:block;flex:1}
  .crumb{display:none}
  .bar{padding:10px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="eyebrow">Oracle · Migrate lên ExaCC</div>
      <h1>Sơ đồ kiến trúc</h1>
    </div>
    <nav id="nav" aria-label="Danh sách sơ đồ"></nav>
  </aside>

  <main class="main">
    <div class="bar">
      <select id="pick" aria-label="Chọn sơ đồ"></select>
      <div class="crumb" id="crumb"></div>
      <span class="sp"></span>
      <button type="button" class="btn" id="toggle-comments" aria-pressed="false" aria-controls="comments">💬 Nhận xét</button>
      <a class="btn" id="open" href="#" target="_blank" rel="noopener">Mở tab mới ↗</a>
    </div>
    <div class="work">
      <iframe id="view" title="Sơ đồ" allow="clipboard-write"></iframe>
      <aside class="comments" id="comments" aria-label="Nhận xét">
        <div class="c-head">
          <div><h2>Nhận xét</h2><p id="c-title"></p></div>
          <button type="button" class="x" id="close-comments" aria-label="Đóng">×</button>
        </div>
        <div class="c-body" id="c-body"></div>
      </aside>
    </div>
  </main>
</div>

<script>
(() => {
  // Danh sách sơ đồ: thêm trang mới thì thêm một dòng vào đúng nhóm
  const GROUPS = [
    { title: 'Hiện trạng · IBM AIX', color: '#7d8495', items: [
      { id: 'digital-aix', name: 'Omnichannel', file: 'oracle-digital-onprem-aix-light.html' },
      { id: 'hub-aix', name: 'Hub', file: 'oracle-hub-onprem-aix-light.html' },
      { id: 'card-aix', name: 'BankWork', file: 'oracle-card-onprem-aix-light.html' },
      { id: 'dwh-aix', name: 'Data Warehouse', file: 'oracle-dwh-onprem-aix-light.html' },
    ]},
    { title: 'Mục tiêu · ExaCC (logic)', color: '#c74634', items: [
      { id: 'digital-exacc', name: 'Omnichannel + Hub', file: 'oracle-digital-dc-dr-light.html' },
      { id: 'card-exacc', name: 'BankWork', file: 'oracle-card-dc-dr-light.html' },
      { id: 'dwh-exacc', name: 'Data Warehouse', file: 'oracle-dwh-dc-dr-light.html' },
    ]},
    { title: 'Hạ tầng vật lý · ExaCC', color: '#2f6bd8', items: [
      { id: 'physical', name: 'Tổng thể DC – DR', file: 'oracle-exacc-physical-light.html' },
      { id: 'infra-dc', name: 'Exadata Infrastructure', tag: 'DC', file: 'oracle-exacc-infra-dc-light.html' },
      { id: 'infra-dr', name: 'Exadata Infrastructure', tag: 'DR', file: 'oracle-exacc-infra-dr-light.html' },
    ]},
  ];
  // Nhận xét lưu trong comments.json (cùng thư mục): [{ diagram, author, date, text }]
  let COMMENTS = [];
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const forId = id => COMMENTS.filter(c => c.diagram === id);

  const ALL = GROUPS.flatMap(g => g.items.map(it => ({ ...it, group: g.title })));
  const byId = Object.fromEntries(ALL.map(it => [it.id, it]));
  const byFile = Object.fromEntries(ALL.map(it => [it.file, it]));

  const $ = id => document.getElementById(id);
  const nav = $('nav'), pick = $('pick'), view = $('view');

  nav.innerHTML = GROUPS.map(g => `
    <div class="group">
      <div class="group-title" style="--c:${g.color}"><i></i>${g.title}</div>
      ${g.items.map(it => `<a href="#${it.id}" data-id="${it.id}">${it.name}${it.tag ? `<small>${it.tag}</small>` : ''}</a>`).join('')}
    </div>`).join('');
  pick.innerHTML = GROUPS.map(g =>
    `<optgroup label="${g.title}">${g.items.map(it =>
      `<option value="${it.id}">${it.name}${it.tag ? ' · ' + it.tag : ''}</option>`).join('')}</optgroup>`).join('');

  function show(id, fromFrame = false) {
    const it = byId[id] || ALL[0];
    nav.querySelectorAll('a').forEach(a =>
      a.toggleAttribute('aria-current', a.dataset.id === it.id) || a.removeAttribute('aria-current'));
    nav.querySelector(`a[data-id="${it.id}"]`).setAttribute('aria-current', 'page');
    pick.value = it.id;
    $('crumb').innerHTML = `${it.group} · <b>${it.name}${it.tag ? ' ' + it.tag : ''}</b>`;
    $('open').href = it.file;
    document.title = `${it.name}${it.tag ? ' ' + it.tag : ''} · Sơ đồ kiến trúc Oracle`;
    if (!fromFrame && !view.src.endsWith(it.file)) view.src = it.file;
    try { localStorage.setItem('diagram-index', it.id); } catch (e) {}
    current = it;
    renderComments();
  }

  // --- Nhận xét: khung bên phải hiện nhận xét của sơ đồ đang xem ---
  let current = null;
  const app = document.querySelector('.app');
  function setComments(on) {
    app.classList.toggle('show-comments', on);
    $('toggle-comments').setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('diagram-comments', on ? '1' : '0'); } catch (e) {}
    if (on) renderComments();
  }
  function renderComments() {
    if (!current) return;
    const list = forId(current.id);
    $('toggle-comments').innerHTML = `💬 Nhận xét${list.length ? `<span class="count">${list.length}</span>` : ''}`;
    if (!app.classList.contains('show-comments')) return;
    $('c-title').textContent = `${current.group} · ${current.name}${current.tag ? ' ' + current.tag : ''}`;
    let who = '';
    try { who = localStorage.getItem('diagram-author') || ''; } catch (e) {}
    const form = canPost
      ? `<form class="cform" id="cform">
          <input id="c-author" maxlength="60" placeholder="Tên của bạn" value="${esc(who)}">
          <textarea id="c-text" rows="4" maxlength="2000" placeholder="Nhận xét về sơ đồ này…" required></textarea>
          <div class="row"><span class="msg" id="c-msg"></span><button class="btn primary" id="c-send" type="submit">Gửi nhận xét</button></div>
        </form>`
      : `<div class="c-note">Bản chỉ xem. Gửi nhận xét qua trang chạy bằng <code>server.js</code>.</div>`;
    $('c-body').innerHTML = form + (list.length
      ? list.slice().reverse().map(c => `<div class="cmt"><div class="cmt-meta"><b>${esc(c.author || 'Ẩn danh')}</b><span>${esc(c.date || '')}</span></div><p>${esc(c.text)}</p></div>`).join('')
      : `<div class="c-note">Chưa có nhận xét cho sơ đồ này.</div>`);
    const f = $('cform');
    if (f) f.addEventListener('submit', async e => {
      e.preventDefault();
      const text = $('c-text').value.trim(), author = $('c-author').value.trim();
      if (!text) return;
      const btn = $('c-send'), msg = $('c-msg');
      btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Đang gửi…';
      try { localStorage.setItem('diagram-author', author); } catch (err) {}
      try {
        const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ diagram: current.id, author, text }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Gửi không thành công');
        await loadComments();
        const m = $('c-msg'); if (m) m.textContent = 'Đã lưu ✓';
      } catch (err) {
        btn.disabled = false; msg.className = 'msg err'; msg.textContent = err.message;
      }
    });
  }
  // Mục "Nhận xét" trên menu: số nhận xét từng sơ đồ + các nhận xét mới nhất
  function renderNavComments() {
    nav.querySelectorAll('a[data-id]').forEach(a => {
      a.querySelector('.badge')?.remove();
      const n = forId(a.dataset.id).length;
      if (n) a.insertAdjacentHTML('beforeend', `<span class="badge">${n}</span>`);
    });
    nav.querySelector('.feed')?.remove();
    const recent = [...COMMENTS].sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 8);
    nav.insertAdjacentHTML('beforeend', `<div class="group feed">
      <div class="group-title" style="--c:#b26a00"><i></i>Nhận xét (${COMMENTS.length})</div>
      ${recent.length ? recent.map(c => {
        const it = byId[c.diagram];
        return `<a href="#${esc(c.diagram)}" data-open-comments="1"><span class="f-meta">${esc(c.author || 'Ẩn danh')} · ${esc(it ? it.name + (it.tag ? ' ' + it.tag : '') : c.diagram)}${c.date ? ' · ' + esc(c.date) : ''}</span><span class="f-text">${esc(c.text)}</span></a>`;
      }).join('') : '<a aria-disabled="true"><span class="f-text">Chưa có nhận xét.</span></a>'}
    </div>`);
  }
  nav.addEventListener('click', e => { if (e.target.closest('[data-open-comments]')) setComments(true); });
  // API nhận xét: cùng trang (server.js local hoặc Vercel); trên GitHub Pages thì gọi sang Vercel.
  // Sau khi deploy Vercel, điền link vào REMOTE_API, vd 'https://oracle-diagrams.vercel.app/api/comments'
  const REMOTE_API = 'https://oracle-diagrams.vercel.app/api/comments';
  const API_URL = location.hostname.endsWith('github.io') && REMOTE_API ? REMOTE_API : 'api/comments';
  let canPost = false;
  async function loadComments() {
    try {
      const r = await fetch(API_URL, { cache: 'no-store' });
      if (!r.ok) throw 0;
      COMMENTS = await r.json(); canPost = true;
    } catch (e) {
      try { const r = await fetch('comments.json?t=' + Date.now(), { cache: 'no-store' }); COMMENTS = r.ok ? await r.json() : []; }
      catch (e2) { COMMENTS = []; }
      canPost = false;
    }
    if (!Array.isArray(COMMENTS)) COMMENTS = [];
    renderNavComments(); renderComments();
  }
  loadComments();
  $('toggle-comments').addEventListener('click', () => setComments(!app.classList.contains('show-comments')));
  $('close-comments').addEventListener('click', () => setComments(false));

  pick.addEventListener('change', () => { location.hash = pick.value; });
  addEventListener('hashchange', () => show(location.hash.slice(1)));

  // Bấm liên kết "Xem DR →", "Xem mô hình ExaCC →"… bên trong sơ đồ: cập nhật menu theo trang đang mở
  view.addEventListener('load', () => {
    let file = '';
    try { file = view.contentWindow.location.pathname.split('/').pop(); } catch (e) { return; }
    const it = byFile[file];
    if (it && location.hash.slice(1) !== it.id) {
      history.replaceState(null, '', '#' + it.id);
      show(it.id, true);
    }
  });

  try { if (localStorage.getItem('diagram-comments') === '1') app.classList.add('show-comments'), $('toggle-comments').setAttribute('aria-pressed', 'true'); } catch (e) {}
  let start = location.hash.slice(1);
  if (!byId[start]) { try { start = localStorage.getItem('diagram-index') || ''; } catch (e) {} }
  show(byId[start] ? start : ALL[0].id);
})();
</script>
</body>
</html>
