<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sơ đồ kiến trúc Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f4;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --ink:#151922;
  --ink-2:#4b5263;
  --ink-3:#7d8495;
  --line:#e3e6eb;
  --line-2:#cdd2da;
  --accent:#c74634;
  --accent-soft:#fbebe8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

.app{display:grid;grid-template-columns:268px 1fr;height:100vh}
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:4px 0 0;font-size:16px;line-height:1.3;font-weight:700}

nav{padding:12px 10px 20px}
.group{margin-top:12px}
.group-title{display:flex;align-items:center;gap:8px;padding:0 10px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.group-title i{width:8px;height:8px;border-radius:2px;background:var(--c)}
nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:1px 0;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a small{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500}
nav a[aria-current="page"] small{color:inherit;opacity:.75}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.main{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.bar .sp{flex:1}
.btn{appearance:none;font:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#pick{display:none;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);max-width:100%}
iframe{flex:1;width:100%;border:0;background:var(--bg)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:none}
  #pick{display:block;flex:1}
  .crumb{display:none}
  .bar{padding:10px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="eyebrow">Oracle · Migrate lên ExaCC</div>
      <h1>Sơ đồ kiến trúc</h1>
    </div>
    <nav id="nav" aria-label="Danh sách sơ đồ"></nav>
  </aside>

  <main class="main">
    <div class="bar">
      <select id="pick" aria-label="Chọn sơ đồ"></select>
      <div class="crumb" id="crumb"></div>
      <span class="sp"></span>
      <a class="btn" id="open" href="#" target="_blank" rel="noopener">Mở tab mới ↗</a>
    </div>
    <iframe id="view" title="Sơ đồ" allow="clipboard-write"></iframe>
  </main>
</div>

<script>
(() => {
  // Danh sách sơ đồ: thêm trang mới thì thêm một dòng vào đúng nhóm
  const GROUPS = [
    { title: 'Hiện trạng · IBM AIX', color: '#7d8495', items: [
      { id: 'digital-aix', name: 'Digital (Omnichannel)', file: 'oracle-digital-onprem-aix-light.html' },
      { id: 'hub-aix', name: 'Hub', file: 'oracle-hub-onprem-aix-light.html' },
      { id: 'card-aix', name: 'Card', file: 'oracle-card-onprem-aix-light.html' },
      { id: 'dwh-aix', name: 'Data Warehouse', file: 'oracle-dwh-onprem-aix-light.html' },
    ]},
    { title: 'Mục tiêu · ExaCC (logic)', color: '#c74634', items: [
      { id: 'digital-exacc', name: 'Digital + Hub', file: 'oracle-digital-dc-dr-light.html' },
      { id: 'card-exacc', name: 'Card', file: 'oracle-card-dc-dr-light.html' },
      { id: 'dwh-exacc', name: 'Data Warehouse', file: 'oracle-dwh-dc-dr-light.html' },
    ]},
    { title: 'Hạ tầng vật lý · ExaCC', color: '#2f6bd8', items: [
      { id: 'physical', name: 'Tổng thể DC – DR', file: 'oracle-exacc-physical-light.html' },
      { id: 'infra-dc', name: 'Exadata Infrastructure', tag: 'DC', file: 'oracle-exacc-infra-dc-light.html' },
      { id: 'infra-dr', name: 'Exadata Infrastructure', tag: 'DR', file: 'oracle-exacc-infra-dr-light.html' },
    ]},
  ];
  const ALL = GROUPS.flatMap(g => g.items.map(it => ({ ...it, group: g.title })));
  const byId = Object.fromEntries(ALL.map(it => [it.id, it]));
  const byFile = Object.fromEntries(ALL.map(it => [it.file, it]));

  const $ = id => document.getElementById(id);
  const nav = $('nav'), pick = $('pick'), view = $('view');

  nav.innerHTML = GROUPS.map(g => `
    <div class="group">
      <div class="group-title" style="--c:${g.color}"><i></i>${g.title}</div>
      ${g.items.map(it => `<a href="#${it.id}" data-id="${it.id}">${it.name}${it.tag ? `<small>${it.tag}</small>` : ''}</a>`).join('')}
    </div>`).join('');
  pick.innerHTML = GROUPS.map(g =>
    `<optgroup label="${g.title}">${g.items.map(it =>
      `<option value="${it.id}">${it.name}${it.tag ? ' · ' + it.tag : ''}</option>`).join('')}</optgroup>`).join('');

  function show(id, fromFrame = false) {
    const it = byId[id] || ALL[0];
    nav.querySelectorAll('a').forEach(a =>
      a.toggleAttribute('aria-current', a.dataset.id === it.id) || a.removeAttribute('aria-current'));
    nav.querySelector(`a[data-id="${it.id}"]`).setAttribute('aria-current', 'page');
    pick.value = it.id;
    $('crumb').innerHTML = `${it.group} · <b>${it.name}${it.tag ? ' ' + it.tag : ''}</b>`;
    $('open').href = it.file;
    document.title = `${it.name}${it.tag ? ' ' + it.tag : ''} · Sơ đồ kiến trúc Oracle`;
    if (!fromFrame && !view.src.endsWith(it.file)) view.src = it.file;
    try { localStorage.setItem('diagram-index', it.id); } catch (e) {}
  }

  pick.addEventListener('change', () => { location.hash = pick.value; });
  addEventListener('hashchange', () => show(location.hash.slice(1)));

  // Bấm liên kết "Xem DR →", "Xem mô hình ExaCC →"… bên trong sơ đồ: cập nhật menu theo trang đang mở
  view.addEventListener('load', () => {
    let file = '';
    try { file = view.contentWindow.location.pathname.split('/').pop(); } catch (e) { return; }
    const it = byFile[file];
    if (it && location.hash.slice(1) !== it.id) {
      history.replaceState(null, '', '#' + it.id);
      show(it.id, true);
    }
  });

  let start = location.hash.slice(1);
  if (!byId[start]) { try { start = localStorage.getItem('diagram-index') || ''; } catch (e) {} }
  show(byId[start] ? start : ALL[0].id);
})();
</script>
</body>
</html>
